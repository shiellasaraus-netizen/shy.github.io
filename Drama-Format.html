<style>
.movie-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 20px;
}

.movie-card {
  border-radius: 12px;
  overflow: hidden;
  background: #111;
  color: white;
  transition: transform 0.3s ease;
}

.movie-card img {
  width: 100%;
  height: 220px;
  object-fit: cover;
}

.movie-card:hover {
  transform: scale(1.05);
}

.movie-info {

}
</style>
